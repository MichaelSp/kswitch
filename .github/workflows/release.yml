name: Release

on:
  release:
    types:
      - published

# Only allow one release workflow to run at a time; never cancel an in-flight
# publish since that could leave a partial release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Minimum permissions at workflow level; the release job declares what it needs.
permissions:
  contents: read

jobs:
  release:
    name: Release
    environment: Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # Required to upload release assets
      contents: write
      # Required for keyless cosign signing via OIDC
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # goreleaser needs the full tag history to generate changelogs
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Run goreleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
